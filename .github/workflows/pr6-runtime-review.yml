name: PR6 experimental runtime review tests

on:
  push:
    branches:
      - experiment/ktp-dynamic-perspective-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-review-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pillow opencv-python-headless
      - name: PR6 runtime and UI synthetic regression
        run: |
          python -m pytest tests/ktp/test_side_boundary_recovery_pr6.py tests/ktp/test_region_context_pr6.py tests/ktp/test_outer_region_recovery_pr6.py tests/ktp/test_chroma_quad_proposals_pr6.py tests/ktp/test_pr6_visual_diagnostics.py tests/ktp/test_line_quad_proposals_pr6.py tests/ktp/test_pr6_runtime_review.py tests/ui/test_pr6_runtime_review_flow.py tests/ui/test_manual_fallback_bridge_pr6.py tests/ktp/test_review_gate_consolidation_pr6.py -q
      - name: Install virtual display for real Tk geometry regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
      - name: Test action buttons at compact and narrow window sizes
        run: |
          xvfb-run -a python -m pytest tests/ui/test_pr6_responsive_action_layout.py tests/ui/test_pr6_candidate_debug.py -v
